# allow-plane-and-ingress only admits this namespace and ingress-nginx. The
# CloudNativePG operator also has to reach each instance's status endpoint on
# 8000, or it can't manage the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: project-management
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: windshift-pg
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
