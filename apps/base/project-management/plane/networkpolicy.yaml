# Postgres, Redis and RabbitMQ keep the chart's default credentials, so only
# Plane itself and ingress-nginx may connect to anything here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-plane-and-ingress
  namespace: project-management
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
