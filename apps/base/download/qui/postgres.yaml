apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: qui-pg
  namespace: download
  labels:
    app: qui
spec:
  instances: 1
  storage:
    size: 1Gi
    storageClass: longhorn
  # With a single instance the PDB can never be satisfied, so it would block
  # every node drain (e.g. k3s upgrades).
  enablePDB: false
  bootstrap:
    initdb:
      database: qui
      owner: qui
