# Overrides the generated resource name prefix (e.g. "amex-tracker").
fullnameOverride: ""

# Public hostname — DNS must point at your ingress controller or external gateway.
host: amex-tracker.example.com

image:
  backend: alfiemellor/amex-tracker-backend:latest
  frontend: alfiemellor/amex-tracker-frontend:latest
  pullPolicy: IfNotPresent

ingress:
  enabled: true # false = route externally, e.g. with Gateway API
  className: "" # empty = use the cluster default IngressClass
  # tls also controls app HTTPS URLs and secure cookies, even when enabled=false.
  # Match the external route's TLS setting when routing outside this chart.
  tls: true # false = plain HTTP, no cert-manager annotations (local clusters)
  clusterIssuer: letsencrypt-prod # cert-manager ClusterIssuer name
  tlsSecretName: amex-tracker-tls
  annotations: {} # any extra ingress annotations

auth:
  enabled: true
  ownerEmails: "" # owner Google email(s), full access (prefer the Secret in prod)
  memberEmails: "" # supplementary cardholder email(s), view + log own payments
  googleClientId: ""
  googleClientSecret: ""
  sessionSecret: "" # generate with: openssl rand -hex 32

gocardless:
  secretId: ""
  secretKey: ""
  maxHistoricalDays: 730
  accessValidForDays: 90

app:
  # Sensitive — set via the Secret / OnePasswordItem (existingSecret), not here.
  supplementaryNames: ""
  # Sensitive — the supplementary cardholder's name as their bank sends it on
  # transfers (e.g. "TAYLOR S"); set via the Secret like supplementaryNames.
  payerNames: ""
  # First day (YYYY-MM-DD) bank transfers count as payments. Empty = bank sync
  # ingests nothing.
  bankSyncFrom: ""
  # Optional cards to auto-create on first boot. Leave empty and add cards in the
  # UI / via sync instead (names are never hardcoded).
  cardNames: ""

# Provide secrets via a pre-created Secret (e.g. Sealed/External Secrets) instead
# of templating them from the values above. If set, the chart won't render a Secret.
# The referenced Secret must contain the AMEX_GOOGLE_*, AMEX_SESSION_SECRET and
# AMEX_GOCARDLESS_* keys, plus AMEX_PAYER_NAMES for bank sync.
existingSecret: ""

postgres:
  enabled: true # CloudNativePG operator must be installed in the cluster
  instances: 1
  database: amex
  owner: amex
  storageSize: 5Gi
  storageClass: "" # "" = cluster default

# pg_dump the database before each release deploys (Helm pre-upgrade / Argo CD PreSync
# hook); a failed dump stops the deploy. Ignored unless postgres.enabled. Dumps are keyed
# on image.backend's tag, so pin a version tag: a reused tag (e.g. latest) dumps only once.
predeployDump:
  enabled: true
  image: postgres:18.7-alpine # client major must be >= the CNPG server's
  keep: 10 # newest dumps kept; older ones are deleted only after a successful dump
  storageSize: 2Gi
  storageClass: "" # "" = cluster default
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Only used when postgres.enabled=false (external/managed DB).
externalDatabaseUrl: ""

backend:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

sync:
  # Every 8 hours = 3 of GoCardless's 4 free-tier fetches per account per day, leaving
  # one for a manual "Sync now". Every 6 hours would use all 4 and block manual syncs.
  schedule: "0 */8 * * *"
  suspend: false # true keeps the CronJob rendered but never scheduled (local clusters)
