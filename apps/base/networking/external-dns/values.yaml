provider:
  name: cloudflare
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: apiKey
txtOwnerId: "external-dns"
domainFilters:
  - "mellor.dev"
policy: sync
# v0.22+ only reads external-dns.kubernetes.io/ annotations by default. Without this,
# the target/hostname annotations (still external-dns.alpha.kubernetes.io/) are ignored
# and external ingress records get published as A records to the LAN LB IP.
#
# Only the ingress-nginx classes. cloudflare-tunnel Ingresses get their DNS from
# cloudflare-tunnel-ingress-controller, which also writes their status; without
# the filter external-dns would publish a record for the same hostname too.
extraArgs:
  - --enable-legacy-annotation-prefix
  - --ingress-class=internal
  - --ingress-class=external
