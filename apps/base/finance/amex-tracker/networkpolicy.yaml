# amex-tracker is reachable from the internet, so the frontend and backend
# only take traffic from the external Envoy
# Gateway, plus Homarr's status ping of the frontend. Nothing
# else in-cluster calls them and there is no ServiceMonitor: the sync CronJob
# talks to Postgres and external APIs directly, not the backend. The selector
# skips the CNPG pods (instance amex-tracker-pg), so the backend and jobs still
# reach Postgres. Egress stays open: the backend calls Google and GoCardless.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amex-tracker
  namespace: finance
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: amex-tracker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: external
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dashboard
          podSelector:
            matchLabels:
              app.kubernetes.io/name: homarr
      ports:
        - protocol: TCP
          port: 80
