fullnameOverride: actual-budget

replicaCount: 1

strategy:
  type: "Recreate"

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 1Gi
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

files:
  dataDirectory: /data
  server: /data/server-files
  user: /data/user-files

persistence:
  enabled: true
  existingClaim: ""
  storageClass: "longhorn"
  accessModes:
    - ReadWriteOnce
  size: 3Gi