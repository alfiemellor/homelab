apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring
resources:
  - daemonset.yaml
  - prometheusrule.yaml

configMapGenerator:
  # Hashed so the DaemonSet rolls automatically when the script changes.
  - name: sdcard-exporter-script
    files:
      - collect.sh
  - name: sdcard-exporter-dashboard
    files:
      - dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
