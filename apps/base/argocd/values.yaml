configs:
  cm:
    accounts.claude-mcp: apiKey
    kustomize.buildOptions: --enable-alpha-plugins --enable-helm
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jsonPointers:
      - /spec/preserveUnknownFields
    # The Tailscale operator rewrites spec.externalName on egress Services
    # (those with a tailscale.com/tailnet-fqdn annotation) to point at its
    # proxy, so the placeholder in git never matches the live value
    resource.customizations.ignoreDifferences.Service: |
      jqPathExpressions:
      - select(.metadata.annotations["tailscale.com/tailnet-fqdn"] != null) | .spec.externalName
  rbac:
    policy.csv: |
      p, role:mcp, applications, sync, */*, allow
      p, role:mcp, applications, action/*, */*, allow
      p, role:mcp, logs, get, */*, allow
      g, role:mcp, role:readonly
      g, claude-mcp, role:mcp

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1024Mi
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
