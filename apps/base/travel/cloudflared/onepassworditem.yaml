# Syncs the "cloudflared-trek" item from the Kubernetes 1Password vault into a
# Secret named "cloudflared-secrets". The item's field labels become the
# Secret's keys, so name the field exactly:
#   TUNNEL_TOKEN   (Zero Trust > Networks > Tunnels > the tunnel > Install
#                   connector; the long string after --token)
#
# The token is all a connector needs to serve the tunnel, so treat it like a
# password; rotating it in the dashboard invalidates the old one.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflared-secrets
  namespace: travel
spec:
  itemPath: "vaults/Kubernetes/items/cloudflared-trek"
