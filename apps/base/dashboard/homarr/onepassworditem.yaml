# Syncs the "homarr" item from the Kubernetes 1Password vault into a Secret
# named "homarr-secrets". The item's field labels become the Secret's keys, so
# name the field exactly:
#   db-encryption-key  (generate with: openssl rand -hex 32)
#
# Homarr encrypts integration secrets with it, so it must stay stable: changing
# it makes them un-decryptable.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: homarr-secrets
  namespace: dashboard
spec:
  itemPath: "vaults/Kubernetes/items/homarr"
