# Syncs the "windshift" item from the Kubernetes 1Password vault into a Secret
# named "windshift-secrets". The item's field labels become the Secret's keys,
# so name the field exactly:
#   SSO_SECRET   (generate with: openssl rand -hex 32)
#
# Windshift signs sessions and encrypts stored SSO/integration credentials with
# it, so it must stay stable: changing it logs everyone out and makes saved
# SSO provider secrets un-decryptable.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: windshift-secrets
  namespace: project-management
spec:
  itemPath: "vaults/Kubernetes/items/windshift"
