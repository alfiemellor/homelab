# The shared Cloudflare token that external-dns already syncs into networking
# from the "cloudflare-api-token" 1Password item. The chart reads all three
# values from one Secret, so that item also carries:
#   account_id    the Cloudflare account ID
#   tunnel_name   homelab (the controller creates the tunnel if it is missing)
# The token itself needs Account > Cloudflare Tunnel > Edit on top of the Zone
# Read and DNS Edit it already has.
cloudflare:
  secretRef:
    name: cloudflare-api-token
    apiTokenKey: apiKey
    accountIDKey: account_id
    tunnelNameKey: tunnel_name

ingressClass:
  name: cloudflare-tunnel
  isDefaultClass: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

# The connectors the controller runs for the tunnel. These are what the
# internet reaches, so networkpolicy.yaml fences them in.
cloudflared:
  # Two connectors on different nodes, so a node drain or an update doesn't
  # take the public apps offline
  replicaCount: 2
  podAntiAffinity: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
