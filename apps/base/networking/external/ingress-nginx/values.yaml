controller:
  config:
    ssl-redirect: "true"
    force-ssl-redirect: "true"
  replicaCount: 3
  resources:
    requests:
      cpu: 50m
      memory: 90Mi
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.universe.tf/address-pool: default
      # Preserve the router's 80/443 forward target during the Envoy Gateway migration.
      metallb.io/loadBalancerIPs: 192.168.1.200
  ingressClassResource:
    name: external
    default: false
    controllerValue: k8s.io/external
  watchIngressWithoutClass: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true