# Data plane for each Gateway, each EnvoyProxy must stay exclusive to its
# Gateway to avoid resource-name collisions in the shared networking namespace.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal
  namespace: networking
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        name: envoy-internal
        replicas: 2
        container:
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: internal
                  gateway.envoyproxy.io/owning-gateway-namespace: networking
      envoyServiceAccount:
        name: envoy-internal
      envoyService:
        name: envoy-internal
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          # A new tailnet device, so the ingress-nginx one keeps serving until cut-over
          tailscale.com/hostname: home-envoy-internal
---
# Wave 1, after wave 0. The external Gateway and everything attached to it
# share the wave: Envoy Gateway rejects a Gateway whose EnvoyProxy doesn't
# exist yet, which on a fresh cluster would leave wave 0 Degraded and this
# never applied.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: external
  namespace: networking
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        name: envoy-external
        replicas: 2
        container:
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: external
                  gateway.envoyproxy.io/owning-gateway-namespace: networking
      envoyServiceAccount:
        name: envoy-external
      envoyService:
        name: envoy-external
        type: LoadBalancer
        # Local keeps the client source IP, as the old ingress-nginx external Service did
        externalTrafficPolicy: Local
        annotations:
          metallb.universe.tf/address-pool: default
          # The router forwards WAN 80/443 here
          metallb.io/loadBalancerIPs: 192.168.1.200
