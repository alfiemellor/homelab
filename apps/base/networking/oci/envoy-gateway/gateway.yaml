# The http listener has no hostname on purpose: external-dns turns a route
# without hostnames on a `*.mellor.dev` listener into a `*.mellor.dev` record,
# and the redirect route has none. It only admits routes from this namespace.
#
# The external-dns label opts the Gateway in to --gateway-label-filter.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: networking
  labels:
    external-dns: enabled
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: internal
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.mellor.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-internal-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
