# Everything Longhorn needs on a node before it can attach a volume.
# https://longhorn.io/docs/latest/deploy/install/#installation-requirements
- name: Install Longhorn node prerequisites
  hosts: all
  become: true
  tasks:
    # nfs-common is only needed for RWX volumes and backups to an NFS target
    - name: Install iSCSI and NFS client packages
      apt:
        name:
          - open-iscsi
          - nfs-common
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Enable and start iscsid
      systemd:
        name: iscsid.service
        enabled: true
        state: started

    # dm_crypt is only used by encrypted volumes, but Longhorn's
    # KernelModulesLoaded node check fails without it
    - name: Load kernel modules now
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - iscsi_tcp
        - dm_crypt

    - name: Load kernel modules on every boot
      copy:
        dest: /etc/modules-load.d/longhorn.conf
        content: |
          iscsi_tcp
          dm_crypt
        mode: "0644"

    - name: Remove the old iscsi_tcp-only module list
      file:
        path: /etc/modules-load.d/iscsi_tcp.conf
        state: absent

    # Longhorn's Multipathd node check fails whenever multipathd is running,
    # even with the blacklist below. Only turned off where the inventory says
    # nothing uses multipath; the socket would otherwise start it again.
    - name: Stop and disable multipathd
      systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - multipathd.socket
        - multipathd.service
      when: longhorn_disable_multipathd | default(false)

- import_playbook: multipath-blacklist.yaml
