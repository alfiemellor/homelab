configs:
  # Envoy terminates TLS with the Gateway's wildcard cert and talks plain HTTP to
  # argocd-server. Keeping TLS to the backend would need a BackendTLSPolicy that
  # validates argocd-server's self-signed cert, and ingress-nginx never verified
  # it anyway.
  params:
    server.insecure: true
  cm:
    accounts.claude-mcp: apiKey
    kustomize.buildOptions: --enable-alpha-plugins --enable-helm
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jsonPointers:
      - /spec/preserveUnknownFields
    # The Tailscale operator rewrites spec.externalName on egress Services
    # (those with a tailscale.com/tailnet-fqdn annotation) to point at its
    # proxy, so the placeholder in git never matches the live value
    resource.customizations.ignoreDifferences.Service: |
      jqPathExpressions:
      - select(.metadata.annotations["tailscale.com/tailnet-fqdn"] != null) | .spec.externalName
  rbac:
    policy.csv: |
      p, role:mcp, applications, sync, */*, allow
      p, role:mcp, applications, action/*, */*, allow
      p, role:mcp, logs, get, */*, allow
      g, role:mcp, role:readonly
      g, claude-mcp, role:mcp

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1024Mi
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5

# The chart points the route at the plain HTTP port because server.insecure is
# set. The argocd CLI's native gRPC doesn't survive the HTTP/1.1 hop to the
# backend (it didn't through ingress-nginx either), so it falls back to
# gRPC-web; `argocd login argocd.mellor.dev --grpc-web` skips the retry.
server:
  httproute:
    enabled: true
    parentRefs:
      - name: internal
        namespace: networking
        sectionName: https
    hostnames:
      - argocd.mellor.dev
