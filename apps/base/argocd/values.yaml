configs:
  cm:
    kustomize.buildOptions: --enable-alpha-plugins --enable-helm
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jsonPointers:
      - /spec/preserveUnknownFields

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1024Mi
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
