# Plex is reachable from the internet and has no Service of its own beyond
# ClusterIP, so clients come in through the external Envoy
# Gateway. Seerr talks to it directly, and
# Homarr status-pings it. Tautulli, Sonarr and Radarr set their Plex
# connection in their UIs, so it could be in-cluster and they are admitted too
# (Tautulli currently uses plex.mellor.dev, which arrives via the ingress).
# Egress stays open: it signs in through plex.tv.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plex
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: plex
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: external
        - podSelector:
            matchLabels:
              app: seerr
        - podSelector:
            matchLabels:
              app: tautulli
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: download
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [sonarr, radarr]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dashboard
          podSelector:
            matchLabels:
              app.kubernetes.io/name: homarr
      ports:
        - protocol: TCP
          port: 32400
