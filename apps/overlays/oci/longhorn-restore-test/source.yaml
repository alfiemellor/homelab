apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: source
  namespace: longhorn-restore-test
  labels:
    # Copy this PVC's recurring job labels onto its Longhorn volume, which
    # takes it out of the default group and into restore-test
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/restore-test: enabled
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: source
  namespace: longhorn-restore-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: source
  template:
    metadata:
      labels:
        app: source
    spec:
      containers:
        - name: source
          image: busybox:1.38
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -c
            - |
              if [ -f /data/marker ]; then
                echo "FOUND on $NODE_NAME: $(cat /data/marker)"
              else
                echo "written on $NODE_NAME at $(date -u +%FT%TZ)" > /data/marker
                sync
                echo "WROTE on $NODE_NAME: $(cat /data/marker)"
              fi
              exec sleep infinity
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: source
