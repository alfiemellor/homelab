apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: windshift-pg
  namespace: project-management
  labels:
    app: windshift
spec:
  # Moving off local-path (HL-28): CNPG can't change an existing volume's
  # class, so a second instance streams a replica onto Longhorn, gets promoted,
  # and then this goes back to 1, which removes the old local-path instance.
  instances: 2
  # Longhorn keeps a copy on each node and backs up to TrueNAS, so the
  # database survives losing a node without CNPG needing a second instance
  storage:
    storageClass: longhorn
    size: 5Gi
  # With a single instance the PDB can never be satisfied, so it would block
  # every node drain (e.g. k3s upgrades). Longhorn reattaches the volume on
  # whichever node the pod comes back on.
  enablePDB: false
  bootstrap:
    initdb:
      database: windshift
      owner: windshift
