apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: truenas
  namespace: networking
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    external-dns.alpha.kubernetes.io/hostname: truenas.mellor.dev
    kubernetes.io/tls-acme: "true"
    # The TrueNAS UI is driven by a long-lived websocket; nginx's 60s default
    # would drop it and leave the UI reconnecting every minute.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: internal
  rules:
  - host: truenas.mellor.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: truenas
            port:
              number: 80
  tls:
  - secretName: truenas.mellor.dev
    hosts:
    - truenas.mellor.dev
