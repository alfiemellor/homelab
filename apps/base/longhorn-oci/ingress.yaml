apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    external-dns.kubernetes.io/hostname: longhorn-oci.mellor.dev
    kubernetes.io/tls-acme: "true"
  name: longhorn
  namespace: longhorn
spec:
  ingressClassName: internal
  rules:
  - host: longhorn-oci.mellor.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: longhorn-frontend
            port:
              number: 80
  tls:
  - secretName: longhorn-oci.mellor.dev
    hosts:
    - longhorn-oci.mellor.dev
