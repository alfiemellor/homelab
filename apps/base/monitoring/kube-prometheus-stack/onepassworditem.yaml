# Syncs the "grafana-admin" item from the Kubernetes 1Password vault into a
# Secret named "grafana-admin" (referenced by values.yaml -> grafana.admin.existingSecret).
# The item's field labels become the Secret's keys, so name the fields exactly:
#   admin-user, admin-password
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  itemPath: "vaults/Kubernetes/items/grafana-admin"
