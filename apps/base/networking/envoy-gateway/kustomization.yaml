apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The chart ships the Gateway API and Envoy Gateway
# CRDs, and Argo skips the dry run for CRs whose CRD is in the same sync.
resources:
  - gatewayclass.yaml
  - envoyproxy.yaml
  - certificate.yaml
  - gateway.yaml
  - httproute.yaml
  - clienttrafficpolicy.yaml
  - backendtrafficpolicy.yaml
helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: 1.10.0
    releaseName: envoy-gateway
    namespace: networking
    includeCRDs: true
    valuesFile: values.yaml
