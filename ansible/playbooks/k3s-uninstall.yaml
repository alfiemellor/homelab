---
# Run with: ansible-playbook playbooks/k3s-uninstall.yaml -e confirm_uninstall=yes
# Limit to one node with:  --limit k3s-01,k3s-03

- name: Confirm intent
  hosts: all
  gather_facts: false
  tasks:
    - name: Require an explicit confirmation
      assert:
        that:
          - confirm_uninstall | default('') == 'yes'
        fail_msg: >-
          Refusing to run. This destroys the k3s installation on
          {{ ansible_play_hosts_all | join(', ') }}.
          Re-run with -e confirm_uninstall=yes if that is what you want.
      run_once: true

- name: Uninstall k3s from workers
  hosts: workers
  become: true
  tasks:
    - name: Check whether the API server is reachable
      command: k3s kubectl get --raw /readyz
      register: api_reachable
      changed_when: false
      failed_when: false
      delegate_to: "{{ groups['master'][0] }}"

    - name: Deregister the node
      command: >-
        k3s kubectl delete node {{ inventory_hostname }}
        --ignore-not-found --timeout=60s
      delegate_to: "{{ groups['master'][0] }}"
      when: api_reachable.rc == 0
      failed_when: false

    - name: Remove the node-password secret
      command: >-
        k3s kubectl -n kube-system delete secret
        {{ inventory_hostname }}.node-password.k3s --ignore-not-found
      delegate_to: "{{ groups['master'][0] }}"
      when: api_reachable.rc == 0
      failed_when: false

    - name: Check if k3s-agent-uninstall.sh exists
      stat:
        path: /usr/local/bin/k3s-agent-uninstall.sh
      register: agent_uninstall_script

    - name: Run k3s agent uninstall script
      command: /usr/local/bin/k3s-agent-uninstall.sh
      when: agent_uninstall_script.stat.exists

    - name: Clean up any leftover k3s directories on workers
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/rancher/k3s
        - /etc/rancher/node
        - /var/lib/rancher/k3s
        - /var/lib/kubelet
        - /var/lib/cni
        - "{{ k3s_token_path }}"

- name: Uninstall k3s from master
  hosts: master
  become: true
  tasks:
    - name: Check if k3s-uninstall.sh exists
      stat:
        path: /usr/local/bin/k3s-uninstall.sh
      register: server_uninstall_script

    - name: Run k3s server uninstall script
      command: /usr/local/bin/k3s-uninstall.sh
      when: server_uninstall_script.stat.exists

    - name: Clean up any leftover k3s directories on master
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/rancher/k3s
        - /etc/rancher/node
        - /var/lib/rancher/k3s
        - /var/lib/kubelet
        - /var/lib/cni
        - "{{ k3s_token_path }}"
        - /root/.kube/config
