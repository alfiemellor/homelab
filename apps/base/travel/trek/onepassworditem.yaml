# Syncs the "trek" item from the Kubernetes 1Password vault into a Secret named
# "trek-secrets". The item's field labels become the Secret's keys, so name the
# fields exactly:
#   ENCRYPTION_KEY   (generate with: openssl rand -hex 32)
#   ADMIN_EMAIL      (optional, only read on first boot when no users exist)
#   ADMIN_PASSWORD   (optional, as above; otherwise a random one is logged)
#
# TREK encrypts stored API keys, MFA secrets and SMTP/OIDC credentials with
# ENCRYPTION_KEY, so it must stay stable: changing it makes them un-decryptable.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: trek-secrets
  namespace: travel
spec:
  itemPath: "vaults/Kubernetes/items/trek"
