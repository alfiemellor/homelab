apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingress.yaml
  - servicemonitor.yaml
  - networkpolicy.yaml
  - recurringjobs.yaml
helmCharts:
  # Keep in step with base/longhorn. Renovate bumps both, and the two clusters
  # should run the same Longhorn version.
  - name: longhorn
    repo: https://charts.longhorn.io/
    version: 1.12.1
    releaseName: longhorn
    namespace: longhorn
    valuesFile: values.yaml
