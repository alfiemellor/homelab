# Syncs the "homarr" item from the Kubernetes 1Password vault into a Secret
# named "homarr-secrets". The item's field labels become the Secret's keys, so
# name the fields exactly:
#   db-encryption-key  (generate with: openssl rand -hex 32)
#   username           (the admin the provision Job creates; 3+ characters)
#   password           (8+ characters)
#
# Homarr encrypts integration secrets with db-encryption-key, so it must stay
# stable: changing it makes them un-decryptable. The provision Job only creates
# the admin on first boot, so changing username/password afterwards does not
# change the account; it just stops the Job from signing in.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: homarr-secrets
  namespace: dashboard
spec:
  itemPath: "vaults/Kubernetes/items/homarr"
