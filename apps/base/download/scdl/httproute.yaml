# Also on http-scdl because scdl is served over plain HTTP as well as HTTPS
# (the old nginx Ingress had ssl-redirect off). The 512m body limit and 900s
# timeouts it set need nothing here:
# Envoy streams bodies with no size cap, and the Gateway-wide policies already
# drop the request timeout and allow 3600s idle.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scdl
  namespace: download
spec:
  parentRefs:
    - name: external
      namespace: networking
      sectionName: https
    - name: external
      namespace: networking
      sectionName: http-scdl
  hostnames:
    - scdl.mellor.dev
  rules:
    - backendRefs:
        - name: scdl
          port: 8000
