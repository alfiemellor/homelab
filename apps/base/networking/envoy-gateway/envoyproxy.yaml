# Data plane for each Gateway. Envoy defaults to 100m / 512Mi; these match
# ingress-nginx's requests instead. Two replicas, spread across nodes, so a Pi
# reboot doesn't drop the Gateway. Both images are multi-arch.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal
  namespace: networking
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            requests:
              cpu: 50m
              memory: 90Mi
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: internal
                  gateway.envoyproxy.io/owning-gateway-namespace: networking
      envoyService:
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          # A new tailnet device, so the ingress-nginx one keeps serving until cut-over
          tailscale.com/hostname: home-envoy-internal
---
# Wave 1, after ingress-nginx's external Service (wave 0) has moved off .200.
# MetalLB 0.16 doesn't retry a Service whose requested IP was taken when another
# Service later frees it, so if Envoy asked for .200 first it would sit Pending.
# Argo waits for wave 0 to be healthy, giving MetalLB time to free .200. The
# external Gateway and everything attached to it share the wave: Envoy Gateway
# rejects a Gateway whose EnvoyProxy doesn't exist yet, which on a fresh
# cluster would leave wave 0 Degraded and this never applied.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: external
  namespace: networking
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            requests:
              cpu: 50m
              memory: 90Mi
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: external
                  gateway.envoyproxy.io/owning-gateway-namespace: networking
      envoyService:
        type: LoadBalancer
        # Local keeps the client source IP, as on the ingress-nginx external Service
        externalTrafficPolicy: Local
        annotations:
          metallb.universe.tf/address-pool: default
          # The router forwards WAN 80/443 here
          metallb.io/loadBalancerIPs: 192.168.1.200
