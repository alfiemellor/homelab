provider:
  name: cloudflare
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: apiKey
txtOwnerId: "external-dns"
domainFilters:
  - "mellor.dev"
policy: sync
sources:
  - service
  - gateway-httproute
# v0.22+ only reads external-dns.kubernetes.io/ annotations by default. Without this,
# the target/hostname annotations (still external-dns.alpha.kubernetes.io/) are ignored
# and external ingress records get published as A records to the LAN LB IP.
#
# No ingress source: the only home Ingress is trek (cloudflare-tunnel), which gets its DNS
# from cloudflare-tunnel-ingress-controller, which also writes its status; watching
# Ingresses here would publish a record for the same hostname too.
#
# HTTPRoutes are only published when attached to a Gateway carrying the
# external-dns=enabled label (apps/base/networking/envoy-gateway/gateway.yaml).
extraArgs:
  - --enable-legacy-annotation-prefix
  - --gateway-label-filter=external-dns=enabled
