configs:
  cm:
    accounts.claude-mcp: apiKey
    kustomize.buildOptions: --enable-alpha-plugins --enable-helm
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jsonPointers:
      - /spec/preserveUnknownFields
    # Tailscale egress Services must be ExternalName with a placeholder
    # externalName, which the operator rewrites to its proxy Service. Without
    # this every such Service shows as OutOfSync and selfHeal loops re-applying
    # the placeholder, briefly breaking the egress each time.
    resource.customizations.ignoreDifferences.Service: |
      jsonPointers:
      - /spec/externalName
  rbac:
    policy.csv: |
      p, role:mcp, applications, sync, */*, allow
      p, role:mcp, applications, action/*, */*, allow
      p, role:mcp, logs, get, */*, allow
      g, role:mcp, role:readonly
      g, claude-mcp, role:mcp

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1024Mi
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
