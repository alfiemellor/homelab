apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Same install as ../../envoy-gateway, with only the internal Gateway: OCI is
# tailnet-only. Keep the chart version in step with it (Renovate bumps both).
# The chart ships the Gateway API and Envoy Gateway CRDs, and the oci-apps
# ApplicationSet's SkipDryRunOnMissingResource covers the CRs that arrive in the
# same sync as their CRDs.
resources:
  - gatewayclass.yaml
  - envoyproxy.yaml
  - certificate.yaml
  - gateway.yaml
  - httproute.yaml
  - clienttrafficpolicy.yaml
  - backendtrafficpolicy.yaml
helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: 1.10.0
    releaseName: envoy-gateway
    namespace: networking
    includeCRDs: true
    valuesFile: values.yaml
