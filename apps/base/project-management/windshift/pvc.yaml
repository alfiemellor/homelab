# Attachments, plugins and AI prompt overrides.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: windshift-data-longhorn
  namespace: project-management
  labels:
    app: windshift
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
