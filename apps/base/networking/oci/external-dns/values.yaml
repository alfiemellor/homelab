provider:
  name: cloudflare
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: apiKey
# Must differ from the home cluster's "external-dns". Both run policy: sync on
# the same zone, so with a shared owner ID each would delete the other's records.
txtOwnerId: "external-dns-oci"
domainFilters:
  - "mellor.dev"
policy: sync
