# Replaces the chart's Ingress, disabled via ingress.enabled in values.yaml.
#
# Cloudflare-proxied, so the record answers with Cloudflare's IPs rather than
# the WAN IP. external-dns still takes the target (direct.mellor.dev) from the
# Gateway; Cloudflare follows that CNAME to reach the origin. Needs the zone's
# SSL/TLS mode at Full (strict): the origin serves the wildcard cert, and
# Flexible would fetch port 80, where the Gateway redirects to HTTPS in a loop.
# Envoy now sees Cloudflare's IPs as the client; nothing here keys on them.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: amex-tracker
  namespace: finance
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: external
      namespace: networking
      sectionName: https
  hostnames:
    - amex.mellor.dev
  rules:
    # API + auth + healthcheck go to the backend, as in the chart's Ingress
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: amex-tracker-backend
          port: 8000
    - backendRefs:
        - name: amex-tracker-frontend
          port: 80
