# Homarr is only reached through the internal (tailnet) ingress and by the
# provision Job. Egress stays open on purpose: its status pings hit every
# service in the cluster and TrueNAS on the LAN, and widgets (weather,
# Minecraft status) call out to the internet, so fencing it like TREK would
# leave the board showing everything as down.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homarr
  namespace: dashboard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: internal-ingress-nginx
        - podSelector:
            matchLabels:
              app: homarr-provision
      ports:
        - protocol: TCP
          port: 7575
