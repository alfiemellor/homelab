apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: longhorn
  namespace: longhorn
  labels:
    app.kubernetes.io/name: longhorn
spec:
  # longhorn-backend is the only Service labelled app=longhorn-manager, and it
  # fronts every longhorn-manager pod. Scraping it via Endpoints matters: each
  # manager only reports the volumes whose engine runs on its own node, so a
  # single load-balanced scrape would return a partial view of the cluster.
  selector:
    matchLabels:
      app: longhorn-manager
  namespaceSelector:
    matchNames:
      - longhorn
  endpoints:
    - port: manager
      path: /metrics
      interval: 30s
