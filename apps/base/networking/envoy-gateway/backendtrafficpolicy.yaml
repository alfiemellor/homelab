# Envoy's route timeout defaults to 15s for the whole response, which kills SSE
# and other long responses. Turn it off and leave idle streams to the
# ClientTrafficPolicy's streamIdleTimeout. A route can still set its own.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: no-request-timeout
  namespace: networking
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
  timeout:
    http:
      requestTimeout: 0s
