# A new volume restored from the source volume's first backup. The 10-minute
# backup job is removed in this same commit, so its retention can't delete
# that backup first.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-restore-test
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: "nfs://100.121.50.68:/mnt/vol1/apps/longhorn-oci?backup=backup-04d6e1c270654eba&volume=pvc-1ab3ec65-9967-46ce-ad74-d9fa3aa146a6"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restored
  namespace: longhorn-restore-test
spec:
  storageClassName: longhorn-restore-test
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restored
  namespace: longhorn-restore-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: restored
  template:
    metadata:
      labels:
        app: restored
    spec:
      containers:
        - name: restored
          image: busybox:1.38
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -c
            - |
              if [ -f /data/marker ]; then
                echo "FOUND on $NODE_NAME: $(cat /data/marker)"
              else
                echo "MISSING on $NODE_NAME: no marker in the restored volume"
              fi
              exec sleep infinity
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: restored
