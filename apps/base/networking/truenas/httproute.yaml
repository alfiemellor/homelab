# The appliance is reached over plain HTTP on :80 (see service.yaml), as the
# Ingress did. The UI's websocket is covered by Envoy's default upgrade support
# and the Gateway's 3600s streamIdleTimeout; Envoy has no body size limit, so
# the old proxy-body-size: "0" needs no equivalent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: truenas
  namespace: networking
spec:
  parentRefs:
    - name: internal
      sectionName: https
  hostnames:
    - truenas.mellor.dev
  rules:
    - backendRefs:
        - name: truenas
          port: 80
