# Attachments, plugins and AI prompt overrides.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: windshift-data
  namespace: project-management
  labels:
    app: windshift
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# Replaces windshift-data (local-path). The deployment's initContainer copies
# the old volume across on first start; windshift-data is removed once that's
# been checked (HL-28).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: windshift-data-longhorn
  namespace: project-management
  labels:
    app: windshift
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
