# Envoy Gateway allows websocket upgrades by default, and its Gateway-wide
# policies cover long streams.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plex
  namespace: media
spec:
  parentRefs:
    - name: external
      namespace: networking
      sectionName: https
  hostnames:
    - plex.mellor.dev
  rules:
    - backendRefs:
        - name: plex
          port: 32400
