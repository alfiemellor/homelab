controller:
  config:
    ssl-redirect: "true"
    force-ssl-redirect: "true"
  replicaCount: 3
  resources:
    requests:
      cpu: 50m
      memory: 90Mi
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.universe.tf/address-pool: default
      # Off .200 (the router's forward target, now the Envoy external
      # Gateway's); kept running here so rolling back is a router or IP change
      metallb.io/loadBalancerIPs: 192.168.1.204
  ingressClassResource:
    name: external
    default: false
    controllerValue: k8s.io/external
  watchIngressWithoutClass: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
