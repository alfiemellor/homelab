apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dashboard

# The chart's templates don't set metadata.namespace and Kustomize doesn't add
# it to their output, so they rely on Argo's destination namespace (dashboard).
helmCharts:
  - name: homarr
    releaseName: homarr
    version: 8.40.1
    repo: https://homarr-labs.github.io/charts/
    namespace: dashboard
    valuesFile: values.yaml
resources:
  - onepassworditem.yaml
  - networkpolicy.yaml
patches:
  # The namespaced Role duplicates the ClusterRole. The long-lived token Secret
  # is unused (Homarr reads the pod's projected token) and, unlike that token,
  # never expires, which matters for an account that can read every Secret.
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: homarr-role
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: homarr-rolebinding
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: homarr-sa-token
