# Syncs the "cloudflare-tunnel-ingress-controller" item from the Kubernetes
# 1Password vault into a Secret of the same name. The item's field labels
# become the Secret's keys, so name the fields exactly:
#   api_token     Account > Cloudflare Tunnel > Edit, Zone > Zone > Read and
#                 Zone > DNS > Edit, scoped to the mellor.dev zone. Separate
#                 from external-dns's token.
#   account_id    the Cloudflare account ID
#   tunnel_name   homelab (the controller creates the tunnel if it is missing)
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflare-tunnel-ingress-controller
  namespace: networking
spec:
  itemPath: "vaults/Kubernetes/items/cloudflare-tunnel-ingress-controller"
