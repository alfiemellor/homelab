# Applies provision/board.json to Homarr (see provision.py for what it does).
# As a PostSync hook it runs after every sync of the dashboard app, once Homarr
# is healthy, so changing board.json or bumping the chart re-applies the board.
# On a fresh install it also does Homarr's onboarding, which otherwise needs
# the /init UI.
apiVersion: batch/v1
kind: Job
metadata:
  name: homarr-provision
  namespace: dashboard
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: homarr-provision
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: provision
          image: python:3.13.18-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
          command: ["python3", "-I", "/provision/provision.py"]
          env:
            - name: HOMARR_URL
              value: http://homarr.dashboard.svc:7575
            - name: HOMARR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: username
            - name: HOMARR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: provision
              mountPath: /provision
              readOnly: true
      volumes:
        - name: provision
          configMap:
            name: homarr-provision
