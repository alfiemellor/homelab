# Syncs the "actual212" item from the Kubernetes 1Password vault into a Secret
# named "actual212-secrets". The item's field labels become the Secret's keys,
# so name the fields exactly:
#   T212_API_KEY, T212_API_SECRET, ACTUAL_PASSWORD, ACTUAL_SYNC_ID
# and, only if the budget file is end-to-end encrypted:
#   ACTUAL_ENCRYPTION_PASSWORD
#
# The CronJob references these keys individually rather than with envFrom, so
# any other fields on the item (a Login item's "username", say) are not injected
# into the third-party container's environment.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: actual212-secrets
  namespace: finance
spec:
  itemPath: "vaults/Kubernetes/items/actual212"
