controller:
  config:
    ssl-redirect: "true"
    force-ssl-redirect: "true"
  replicaCount: 3
  resources:
    requests:
      cpu: 50m
      memory: 90Mi
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.universe.tf/address-pool: default
  ingressClassResource:
    name: external
    default: false
    controllerValue: k8s.io/external
  watchIngressWithoutClass: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true