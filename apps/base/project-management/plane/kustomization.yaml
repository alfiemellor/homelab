apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secret.yaml
  - networkpolicy.yaml
helmCharts:
  - name: plane-ce
    repo: https://helm.plane.so
    version: 1.8.6
    releaseName: plane
    namespace: project-management
    valuesFile: values.yaml
patches:
  # The chart stamps every pod template with `timestamp: {{ now }}` so each
  # `helm upgrade` restarts everything. Rendered by ArgoCD it changes whenever
  # the repo does, rolling all of Plane on unrelated commits.
  - target:
      kind: Deployment
    patch: |-
      - op: remove
        path: /spec/template/metadata/annotations/timestamp
  # Both Jobs are named "-1" (Helm's release revision, which is always 1 under
  # `helm template`), and a Job's pod template is immutable, so syncing any
  # change to them fails. As Sync hooks ArgoCD recreates them on each sync
  # instead, the way Helm reruns them on each upgrade.
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/hook: Sync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  # Keep every volume on Longhorn rather than the default local-path class
  # (Windshift HL-28). The templates were renamed so the StatefulSets got new
  # PVCs instead of reusing the old local-path ones; renaming them again would
  # orphan the data in the same way.
  - target:
      kind: StatefulSet
      name: plane-pgdb-wl
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/metadata/name
        value: pvc-plane-pgdb-longhorn
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: longhorn
      - op: replace
        path: /spec/template/spec/containers/0/volumeMounts/0/name
        value: pvc-plane-pgdb-longhorn
  - target:
      kind: StatefulSet
      name: plane-minio-wl
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/metadata/name
        value: pvc-plane-minio-longhorn
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: longhorn
      - op: replace
        path: /spec/template/spec/containers/0/volumeMounts/0/name
        value: pvc-plane-minio-longhorn
  - target:
      kind: StatefulSet
      name: plane-redis-wl
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/metadata/name
        value: pvc-plane-redis-longhorn
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: longhorn
      - op: replace
        path: /spec/template/spec/containers/0/volumeMounts/0/name
        value: pvc-plane-redis-longhorn
  - target:
      kind: StatefulSet
      name: plane-rabbitmq-wl
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/metadata/name
        value: pvc-plane-rabbitmq-longhorn
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: longhorn
      - op: replace
        path: /spec/template/spec/containers/0/volumeMounts/0/name
        value: pvc-plane-rabbitmq-longhorn
