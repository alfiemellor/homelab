# Plex is reachable from the internet and has no Service of its own beyond
# ClusterIP, so clients (and Tautulli, which uses plex.mellor.dev) come in
# through the external ingress-nginx or the external Envoy Gateway that
# replaces it. Seerr talks to it directly, and Homarr status-pings it. Egress
# stays open: it signs in through plex.tv.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plex
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: plex
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: external-ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: external
        - podSelector:
            matchLabels:
              app: seerr
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dashboard
          podSelector:
            matchLabels:
              app.kubernetes.io/name: homarr
      ports:
        - protocol: TCP
          port: 32400
